<style>
:root{--bg:#f5f0e8;--surf:#ede8de;--card:#fff;--bd:#ddd5c5;--a:#b8713a;--ad:#95592e;--ab:rgba(184,113,58,.1);--tx:#2a2218;--sub:#7a6a58;--mu:#b8a898;--gr:#5a9048;--rd:#b03830;--wn:#c08830}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:'Hiragino Sans','Noto Sans TC',sans-serif;color:var(--tx);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0}
input,textarea,select{outline:none;font-family:inherit;color:var(--tx);-webkit-appearance:none}
select option{background:#fff}
#app{position:fixed;top:0;bottom:0;width:100%;max-width:430px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#hdr{flex-shrink:0;padding:12px 20px 10px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.04)}
#cnt{flex:1;overflow:hidden;position:relative}
.tab-pane{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;overflow:hidden}
.tab-pane.active{display:flex}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior-y:contain;padding:14px 14px 70px}
#tbar{flex-shrink:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -1px 8px rgba(0,0,0,.06)}
.tb-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;cursor:pointer;border:none;background:none;font-family:inherit}
.tb-ico{width:32px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .15s}
.tb-btn.on .tb-ico{background:var(--ab)}
.tb-lbl{font-size:10px;color:var(--mu);font-weight:400;letter-spacing:.3px}
.tb-btn.on .tb-lbl{color:var(--a);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--bd);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stitle{font-size:10px;letter-spacing:2px;color:#b8713a;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.pbar-wrap{height:3px;background:var(--bd);border-radius:2px;margin-bottom:12px}
.pbar-fill{height:100%;background:var(--gr);border-radius:2px;transition:width .3s}
.ibt{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--surf);border:1px solid var(--bd);flex-shrink:0;cursor:pointer}
.pill{padding:3px 10px;border-radius:10px;font-size:11px;border:1px solid var(--bd);background:var(--surf);color:var(--sub);cursor:pointer}
.pill.on{background:var(--a);color:#fff;border-color:var(--ad)}
.fab{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--surf);color:var(--sub);font-family:inherit}
.fab.on{background:var(--a);color:#fff;border-color:var(--ad)}
.inp{background:var(--surf);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:13px;width:100%}
.inp:focus{border-color:var(--a)}
.row-item{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--bd)}
.chk-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--bd);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;cursor:pointer}
.chk-box.done{background:var(--gr);border-color:var(--gr)}
.sort-btns{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.day-tabs{display:flex;overflow-x:auto;padding:10px 12px;gap:6px;background:var(--card);border-bottom:1px solid var(--bd);flex-shrink:0;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain;touch-action:pan-x}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:7px 13px;border-radius:20px;gap:3px;background:var(--surf);border:1px solid var(--bd);cursor:pointer;transition:all .15s}
.day-tab.on{background:var(--a);border-color:var(--a)}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:7px}
.cbtn{border-radius:10px;padding:13px 0;font-size:18px;font-weight:500;border:1px solid var(--bd);text-align:center;cursor:pointer;font-family:inherit}
.cbtn.fn{background:var(--surf);color:var(--sub)}
.cbtn.op{background:var(--a);color:#fff;border-color:var(--ad)}
.cbtn.nm{background:var(--card);color:var(--tx)}
</style>
</head>

function buildTabBar(){
  return TABS.map(function(t){
    var on=S.tab===t.id;
    return '<button class="tb-btn'+(on?' on':'')+'" onclick="setTab(\''+t.id+'\')" >'+
      '<div class="tb-ico">'+ico(TAB_ICOS[t.id],20,on?'#b8713a':'#b8a898',on?2:1.5)+'</div>'+
      '<span class="tb-lbl">'+t.label+'</span></button>';
  }).join('');
}
function setTab(id){
  S.tab=id; S.editId=null;
  document.querySelectorAll('.tab-pane').forEach(function(el){el.style.display='none';el.classList.remove('active');});
  var el=document.getElementById('t-'+id);
  el.style.display='flex'; el.classList.add('active');
  document.getElementById('hdr-title').textContent=TITLES[id];
  document.getElementById('tbar').innerHTML=buildTabBar();
  renderTab(id);
}
function renderTab(id){
  if(id==='home')renderHome();
  else if(id==='itin')renderItin();
  else if(id==='exps')renderExps();
  else if(id==='prep')renderPrep();
  else if(id==='other')renderOther();
}

function updateCalcModal(){
  var cd=S.calc;
  var el=document.getElementById('calc-disp-m');
  var op=document.getElementById('calc-op-m');
  if(el)el.textContent=parseFloat(cd.disp).toLocaleString('en',{maximumFractionDigits:2});
  if(op)op.textContent=cd.op?(cd.prev+' '+cd.op):'';
}
function doCalc(b){
  var cd=S.calc;
  if(b==='AC'){cd.disp='0';cd.prev=null;cd.op=null;cd.nxt=false;}
  else if(b==='⌫'){cd.disp=cd.disp.length>1?cd.disp.slice(0,-1):'0';}
  else if(['+','-','×','÷'].indexOf(b)>-1){cd.prev=parseFloat(cd.disp);cd.op=b;cd.nxt=true;}
  else if(b==='='){if(cd.op&&cd.prev!=null){var bv=parseFloat(cd.disp),r=cd.op==='+'?cd.prev+bv:cd.op==='-'?cd.prev-bv:cd.op==='×'?cd.prev*bv:bv?cd.prev/bv:0;cd.disp=String(parseFloat(r.toFixed(2)));cd.prev=null;cd.op=null;cd.nxt=false;}}
  else if(b==='.'){if(cd.nxt){cd.disp='0.';cd.nxt=false;}else if(cd.disp.indexOf('.')<0)cd.disp+='.'; }
  else{if(cd.nxt){cd.disp=b;cd.nxt=false;}else cd.disp=cd.disp==='0'?b:cd.disp.length>10?cd.disp:cd.disp+b;}
  updateCalcModal();
}

function buildCheckList(items,listKey,em){
  var lq=jsq(listKey);
  return items.map(function(it){
    var iid=it.id, tq=jsq(it.t);
    if(S.editId===it.id)return '<div class="row-item">'+
      '<div class="chk-box'+(it.done?' done':'')+'">'+ico(IC.chk,11,'#fff')+'</div>'+
      sortBtns("prepMv('"+lq+"','"+iid+"','up')","prepMv('"+lq+"','"+iid+"','dn')")+
      '<input id="inp-'+iid+'" class="inp" value="'+esc(S.editVal)+'" style="flex:1" oninput="S.editVal=this.value" onkeydown="handleEditKey(event,\'prep\',\''+lq+'\',\''+iid+'\')" />'+
      ibt("commitEdit('prep','"+lq+"','"+iid+"')",'chk','#5a9048')+
      ibt("cancelEdit()",'x','#b8a898')+'</div>';
    return '<div class="row-item">'+
      '<button class="chk-box'+(it.done?' done':'')+'" onclick="toggleCheck(\''+lq+'\',\''+iid+'\')">'+ico(IC.chk,11,'#fff')+'</button>'+
      sortBtns("prepMv('"+lq+"','"+iid+"','up')","prepMv('"+lq+"','"+iid+"','dn')")+
      '<span style="flex:1;font-size:13px;color:'+(it.done?'#b8a898':'#2a2218')+';text-decoration:'+(it.done?'line-through':'none')+';line-height:1.55">'+
        (it.urg&&!it.done?'<span style="color:#c08830;margin-right:3px">⚠️</span>':'')+esc(it.t)+'</span>'+
      (em?ibt("startEdit('"+iid+"','"+tq+"','prep')",'pen'):'')+
      (em?ibt("prepDel('"+lq+"','"+iid+"')",'trash','#b03830'):'')+'</div>';
  }).join('');
}
function toggleCheck(listKey,id){
  var list=listKey==='prep'?S.prep:S.lug;
  var it=list.find(function(i){return i.id===id;});if(it)it.done=!it.done;
  scheduleSave();renderPrep();
}
function prepMv(listKey,id,dir){
  var list=listKey==='prep'?S.prep:S.lug;
  var a=list,idx=a.findIndex(function(i){return i.id===id;}),ni=dir==='up'?idx-1:idx+1;
  if(ni<0||ni>=a.length)return;
  if(listKey!=='prep'&&a[ni].cat!==a[idx].cat)return;
  var tmp=a[idx];a[idx]=a[ni];a[ni]=tmp;
  scheduleSave();renderPrep();
}
function prepDel(listKey,id){
  if(listKey==='prep')S.prep=S.prep.filter(function(i){return i.id!==id;});
  else S.lug=S.lug.filter(function(i){return i.id!==id;});
  scheduleSave();renderPrep();
}

// ── OTHER ───────────────────────────────────────────────────────
function renderOther(){
  var h='';
  S.drive.forEach(function(s,si){
    h+='<div class="card" style="padding:0;overflow:hidden">'+
      '<button onclick="S.drive['+si+'].open=!S.drive['+si+'].open;renderOther()" style="display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;text-align:left">'+
        '<span style="font-size:17px">'+s.icon+'</span>'+
        '<span style="flex:1;font-size:14px;font-weight:500">'+esc(s.title)+'</span>'+
        '<span style="transform:'+(s.open?'rotate(90deg)':'rotate(0)')+';transition:transform .2s;display:flex">'+ico(IC.cr,16,'#b8a898')+'</span>'+
      '</button>'+
      (s.open?'<div style="padding:4px 16px 14px;border-top:1px solid #ddd5c5">'+
        s.items.map(function(item){return'<div style="display:flex;gap:8px;padding:4px 0;align-items:flex-start"><span style="color:#b8713a;font-size:14px;flex-shrink:0;margin-top:1px">·</span><span style="font-size:13px;color:#7a6a58;line-height:1.6">'+esc(item)+'</span></div>';}).join('')+
      '</div>':'')+
    '</div>';
  });
  h+=card(stitle('緊急聯絡資訊')+
    '<button onclick="S.emrg.push({id:uid(),label:\'\',num:\'\'});renderOther()" style="display:flex;align-items:center;gap:4px;padding:4px 10px;background:#b8713a;border-radius:6px;float:right;margin-bottom:8px">'+ico(IC.plus,13,'#fff')+'<span style="font-size:12px;color:#fff">新增</span></button>'+
    '<div style="clear:both"></div>'+
    S.emrg.map(function(ec){
      if(S.emrgEid===ec.id)return '<div style="padding:8px 0;border-bottom:1px solid #ddd5c5">'+
        '<div style="display:flex;flex-direction:column;gap:6px">'+
        '<input class="inp" placeholder="名稱" value="'+esc(S.emrgVal.label!=null?S.emrgVal.label:ec.label)+'" oninput="S.emrgVal.label=this.value"/>'+
        '<input class="inp" placeholder="號碼" value="'+esc(S.emrgVal.num!=null?S.emrgVal.num:ec.num)+'" oninput="S.emrgVal.num=this.value"/>'+
        '<div style="display:flex;gap:6px;align-items:center">'+
          ibt("commitEmrg('"+ec.id+"')",'chk','#5a9048')+
          ibt("cancelEmrg()",'x','#b8a898')+
          '<div style="flex:1"></div>'+
          '<button onclick="if(confirm(\'確定刪除？\'))delEmrg(\''+ec.id+'\')" style="display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:6px;background:#fff0f0;border:1px solid #f0c0c0;font-size:11px;color:#b03830;font-family:inherit">'+ico(IC.trash,13,'#b03830')+' 刪除</button>'+
        '</div></div></div>';
      return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ddd5c5">'+
        ico(IC.phone,14,'#b8713a')+
        '<div style="flex:1"><div style="font-size:13px">'+esc(ec.label||'（未命名）')+'</div><div style="font-size:12px;color:#7a6a58">'+esc(ec.num||'—')+'</div></div>'+
        ibt("startEmrgEdit('"+ec.id+"')",'pen')+'</div>';
    }).join(''));
  h+=card(stitle('備忘錄')+'<textarea style="width:100%;min-height:200px;background:#ede8de;border:1px solid #ddd5c5;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.75;resize:vertical" oninput="S.memo=this.value;scheduleSave()">'+esc(S.memo)+'</textarea>');
  document.getElementById('s-other').innerHTML=h;
}
function commitEmrg(id){var v=S.emrgVal;S.emrg=S.emrg.map(function(e){return e.id===id?{id:e.id,label:v.label!=null?v.label:e.label,num:v.num!=null?v.num:e.num}:e;});S.emrgEid=null;S.emrgVal={};scheduleSave();renderOther();}
function cancelEmrg(){S.emrgEid=null;S.emrgVal={};renderOther();}
function startEmrgEdit(id){var ec=S.emrg.find(function(e){return e.id===id;});if(!ec)return;S.emrgEid=id;S.emrgVal={label:ec.label,num:ec.num};renderOther();}
function delEmrg(id){S.emrg=S.emrg.filter(function(e){return e.id!==id;});scheduleSave();renderOther();}

// ── Generic edit helpers ────────────────────────────────────────
function startEdit(id,val,list){S.editId=id;S.editVal=val;S.editList=list;if(list==='itin')renderItin();else renderPrep();}
function cancelEdit(){S.editId=null;S.editVal='';if(S.editList==='itin')renderItin();else renderPrep();}
function commitEdit(type,context,id){
  if(type==='itin'){var d=S.itin.find(function(x){return x.id===context;});if(d)d.items=d.items.map(function(i){return i.id===id?Object.assign({},i,{t:S.editVal}):i;});}
  else{if(context==='prep')S.prep=S.prep.map(function(i){return i.id===id?Object.assign({},i,{t:S.editVal}):i;});else S.lug=S.lug.map(function(i){return i.id===id?Object.assign({},i,{t:S.editVal}):i;});}
  S.editId=null;S.editVal='';scheduleSave();
  if(type==='itin')renderItin();else renderPrep();
}
function handleEditKey(e,type,context,id){if(e.key==='Enter')commitEdit(type,context,id);else if(e.key==='Escape')cancelEdit();}

document.getElementById('tbar').innerHTML=buildTabBar();

// ══ Load from Firebase ══════════════════════════════════════════
dbLoad(function(d){
  if(d){
    if(d.itin&&d.itin.length)S.itin=d.itin;
    if(d.prep&&d.prep.length)S.prep=d.prep;
    if(d.lug&&d.lug.length)S.lug=d.lug;
    if(d.exps)S.exps=d.exps;
    if(d.emrg&&d.emrg.length)S.emrg=d.emrg;
    if(d.memo!=null)S.memo=d.memo;
    renderHome();renderItin();renderExps();renderPrep();renderOther();
  }
  S.ready=true;
});
